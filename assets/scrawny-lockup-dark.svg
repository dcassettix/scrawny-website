<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="title desc">
  <title id="title">Scrawny</title>
  <desc id="desc">Sage, Bowtie Violet, and Coral flow lines converge behind an asymmetric Scrawny S and exit as one Bowtie Violet arrow.</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 54 H174 C207 54 203 83 240 83 H286" stroke="#778F5A" stroke-width="9"/>
    <path d="M58 110 H452" stroke="#6B52D9" stroke-width="9"/>
    <path d="M58 166 H174 C207 166 203 137 240 137 H315" stroke="#C1685B" stroke-width="9"/>
    <circle cx="40" cy="54" r="12" stroke="#778F5A" stroke-width="8"/>
    <circle cx="40" cy="110" r="12" stroke="#6B52D9" stroke-width="8"/>
    <circle cx="40" cy="166" r="12" stroke="#C1685B" stroke-width="8"/>
    <path d="M390 110 H452" stroke="#6B52D9" stroke-width="9"/>
    <path d="M438 94 L454 110 L438 126" stroke="#6B52D9" stroke-width="9"/>

    <!-- S is deliberately drawn after the circuitry so it cleanly overlays it. -->
    <path d="M355 42 H299 C257 42 235 59 235 83 C235 106 253 116 282 122 L319 130 C354 138 370 157 370 181 C370 212 343 230 302 230 H210" stroke="#F3F1EC" stroke-width="40"/>
    <!-- Slightly heavier/larger lower terminal balances the mark like the approved concept. -->
    <path d="M302 230 H210" stroke="#F3F1EC" stroke-width="46"/>
  </g>


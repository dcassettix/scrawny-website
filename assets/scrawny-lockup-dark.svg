    <path d="M210 30 C210 23 216 20 226 20 H250 V64 H225 C214 64 208 56 208 47 C208 38 214 32 225 32 H250"/>
    <path d="M274 20 L283 64 L300 34 L317 64 L326 20"/>
    <path d="M350 64 V20 H368 C384 20 390 28 390 42 V64"/>
    <path d="M414 20 L429 53 C432 60 438 64 446 64 H458 M458 20 V65 C458 78 451 84 438 84 H424"/>
  </g>
</svg>
